# Local source-build overlay. Not used by GitHub Release installs.
#
#   docker compose -f docker-compose.yml -f compose.dev.yaml -f docker-compose.override.yml up --build -d
#
# If document storage is on a CIFS/NFS bind (0770 host group), include docker-compose.override.yml
# (group_add) — omitting it causes "Document storage unavailable".
#
# Publishes Postgres on localhost:5433 for host-run pytest / uvicorn.

services:
  db:
    ports:
      - "5433:5432"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        LESSPAPER_NGL_VERSION: ${LESSPAPER_NGL_VERSION:-${FOLIUM_VERSION:-0.0.0-dev}}
        LESSPAPER_NGL_BUILD_REVISION: ${LESSPAPER_NGL_BUILD_REVISION:-${FOLIUM_BUILD_REVISION:-}}
        LESSPAPER_NGL_BUILD_DATE: ${LESSPAPER_NGL_BUILD_DATE:-${FOLIUM_BUILD_DATE:-}}
    image: ghcr.io/brocxftw/lesspaper-ngl-backend:${LESSPAPER_NGL_VERSION:-${FOLIUM_VERSION:-dev}}

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        LESSPAPER_NGL_VERSION: ${LESSPAPER_NGL_VERSION:-${FOLIUM_VERSION:-0.0.0-dev}}
        LESSPAPER_NGL_BUILD_REVISION: ${LESSPAPER_NGL_BUILD_REVISION:-${FOLIUM_BUILD_REVISION:-}}
        LESSPAPER_NGL_BUILD_DATE: ${LESSPAPER_NGL_BUILD_DATE:-${FOLIUM_BUILD_DATE:-}}
    image: ghcr.io/brocxftw/lesspaper-ngl-backend:${LESSPAPER_NGL_VERSION:-${FOLIUM_VERSION:-dev}}

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        LESSPAPER_NGL_VERSION: ${LESSPAPER_NGL_VERSION:-${FOLIUM_VERSION:-0.0.0-dev}}
        LESSPAPER_NGL_BUILD_REVISION: ${LESSPAPER_NGL_BUILD_REVISION:-${FOLIUM_BUILD_REVISION:-}}
        LESSPAPER_NGL_BUILD_DATE: ${LESSPAPER_NGL_BUILD_DATE:-${FOLIUM_BUILD_DATE:-}}
    image: ghcr.io/brocxftw/lesspaper-ngl-web:${LESSPAPER_NGL_VERSION:-${FOLIUM_VERSION:-dev}}
