name: CI

on:
  push:
    tags-ignore:
      - "v*"
  pull_request:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: folium
          POSTGRES_PASSWORD: folium
          POSTGRES_DB: folium
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U folium -d folium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install Python
        run: uv python install 3.13
      - name: Install deps
        # OCR extra (paddleocr) is Docker-only; unit tests mock the engine.
        run: uv venv --python 3.13 && uv pip install -e ".[dev]"
      - name: Ruff
        run: .venv/bin/ruff check src tests
      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://folium:folium@localhost:5433/folium_test
          DATABASE_URL_SYNC: postgresql+psycopg://folium:folium@localhost:5433/folium_test
          LESSPAPER_NGL_SECRET_KEY: ci-secret
          LESSPAPER_NGL_ENCRYPTION_KEY: ci-encryption
          LESSPAPER_NGL_ENV: test
          LESSPAPER_NGL_ADMIN_USERNAME: admin
          LESSPAPER_NGL_ADMIN_PASSWORD: testpass
          DOCUMENTS_PATH: /tmp/lesspaper-ngl-ci/documents
          CONSUME_PATH: /tmp/lesspaper-ngl-ci/consume
          EXPORT_PATH: /tmp/lesspaper-ngl-ci/export
          BACKUPS_PATH: /tmp/lesspaper-ngl-ci/backups
          FRONTEND_ORIGIN: http://test
        run: |
          mkdir -p /tmp/lesspaper-ngl-ci/{documents,consume,export,backups}
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17 || sudo apt-get install -y --no-install-recommends postgresql-client
          docker run --rm --network host -e PGPASSWORD=folium pgvector/pgvector:pg17 \
            bash -c "psql -h localhost -p 5433 -U folium -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname='folium_test'\" | grep -q 1 || psql -h localhost -p 5433 -U folium -d postgres -c \"CREATE DATABASE folium_test OWNER folium;\""
          .venv/bin/alembic upgrade head
          .venv/bin/pytest -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public compose
        run: |
          cp .env.example .env
          {
            echo "LESSPAPER_NGL_SECRET_KEY=ci-compose-config-only"
            echo "LESSPAPER_NGL_ENCRYPTION_KEY=ci-compose-config-only"
            echo "POSTGRES_PASSWORD=ci-compose-config-only"
            echo "LESSPAPER_NGL_ADMIN_PASSWORD=ci-compose-config-only"
          } >> .env
          docker compose -f docker-compose.yml config
      - name: Validate development overlay
        run: docker compose -f docker-compose.yml -f compose.dev.yaml config

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -x -P installer installer/install.sh installer/pack.sh \
            installer/lesspaper-ngl-ctl.sh installer/lib/*.sh \
            installer/tests/run.sh installer/tests/smoke.sh
      - name: Installer helper tests
        run: bash installer/tests/run.sh
      - name: Packed single-file installer
        run: |
          bash installer/pack.sh /tmp/install-lesspaper-ngl.sh
          bash -n /tmp/install-lesspaper-ngl.sh
          test -x /tmp/install-lesspaper-ngl.sh
          test -x /tmp/install-folium.sh
          cmp -s /tmp/install-lesspaper-ngl.sh /tmp/install-folium.sh
