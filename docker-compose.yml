# Public lesspaper-ngl Compose — pull pre-built images. No repository source required.
#
# Preferred: curl /releases/download/beta/install-lesspaper-ngl.sh (moving prerelease). Manual:
#   copy this file and env.example from a GitHub Release, then:
#   cp env.example .env
#   # set secrets and POSTGRES_PASSWORD
#   docker compose up -d
#
# Pin a release with LESSPAPER_NGL_VERSION=X.Y.Z in .env (Release assets default to that tag).
# Legacy FOLIUM_VERSION / FOLIUM_*_HOST keys are still accepted for upgrades.
# Contributors building from source: docker compose -f docker-compose.yml -f compose.dev.yaml up --build -d
#
# Extra host GIDs (e.g. CIFS): use a gitignored docker-compose.override.yml with group_add.
#
# Persistence note: volume key folium_pgdata and default Postgres role/db "folium" are
# intentional historical identifiers — do not rename on existing installs.

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-folium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-folium}
    volumes:
      - folium_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    # Keep Postgres on a local Docker volume — never on NFS.

  api:
    image: ghcr.io/brocxftw/lesspaper-ngl-backend:${LESSPAPER_NGL_VERSION:-${FOLIUM_VERSION:-latest}}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-folium}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-folium}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-folium}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-folium}
      DOCUMENTS_PATH: /documents
      CONSUME_PATH: /consume
      EXPORT_PATH: /export
      BACKUPS_PATH: /backups
      LESSPAPER_NGL_DOCUMENTS_HOST_SOURCE: ${LESSPAPER_NGL_DOCUMENTS_HOST_SOURCE:-${FOLIUM_DOCUMENTS_HOST_SOURCE:-}}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:9398}
    volumes:
      - ${LESSPAPER_NGL_DOCUMENTS_HOST:-${FOLIUM_DOCUMENTS_HOST:-./data/documents}}:/documents
      - ${LESSPAPER_NGL_CONSUME_HOST:-${FOLIUM_CONSUME_HOST:-./data/consume}}:/consume
      - ${LESSPAPER_NGL_EXPORT_HOST:-${FOLIUM_EXPORT_HOST:-./data/export}}:/export
      - ${LESSPAPER_NGL_BACKUPS_HOST:-${FOLIUM_BACKUPS_HOST:-./data/backups}}:/backups
      - ${LESSPAPER_NGL_PADDLE_CACHE_HOST:-${FOLIUM_PADDLE_CACHE_HOST:-./data/paddleocr}}:/app/.paddleocr
    ports:
      - "9099:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    user: "1000:1000"
    read_only: false
    security_opt:
      - no-new-privileges:true

  worker:
    image: ghcr.io/brocxftw/lesspaper-ngl-backend:${LESSPAPER_NGL_VERSION:-${FOLIUM_VERSION:-latest}}
    restart: unless-stopped
    command: ["lesspaper-ngl-worker"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-folium}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-folium}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-folium}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-folium}
      DOCUMENTS_PATH: /documents
      CONSUME_PATH: /consume
      EXPORT_PATH: /export
      BACKUPS_PATH: /backups
      LESSPAPER_NGL_DOCUMENTS_HOST_SOURCE: ${LESSPAPER_NGL_DOCUMENTS_HOST_SOURCE:-${FOLIUM_DOCUMENTS_HOST_SOURCE:-}}
    volumes:
      - ${LESSPAPER_NGL_DOCUMENTS_HOST:-${FOLIUM_DOCUMENTS_HOST:-./data/documents}}:/documents
      - ${LESSPAPER_NGL_CONSUME_HOST:-${FOLIUM_CONSUME_HOST:-./data/consume}}:/consume
      - ${LESSPAPER_NGL_EXPORT_HOST:-${FOLIUM_EXPORT_HOST:-./data/export}}:/export
      - ${LESSPAPER_NGL_BACKUPS_HOST:-${FOLIUM_BACKUPS_HOST:-./data/backups}}:/backups
      - ${LESSPAPER_NGL_PADDLE_CACHE_HOST:-${FOLIUM_PADDLE_CACHE_HOST:-./data/paddleocr}}:/app/.paddleocr
    user: "1000:1000"
    healthcheck:
      test: ["CMD", "python", "-m", "lesspaper_ngl.workers.healthcheck"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  web:
    image: ghcr.io/brocxftw/lesspaper-ngl-web:${LESSPAPER_NGL_VERSION:-${FOLIUM_VERSION:-latest}}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "9398:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  folium_pgdata:
